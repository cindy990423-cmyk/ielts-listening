<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>IELTS Studio - 折叠分类版</title>
    <style>
        :root { --sidebar-w: 320px; --header-h: 60px; --primary: #007bff; --danger: #ff4d4f; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }
        
        /* 布局 */
        .main-container { display: flex; height: calc(100% - var(--header-h)); }
        header { 
            height: var(--header-h); background: #2c3e50; color: white; 
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
        }

        /* 侧边栏样式 */
        .sidebar { width: var(--sidebar-w); border-right: 1px solid #ddd; background: #f8f9fa; display: flex; flex-direction: column; }
        .drop-zone { padding: 12px; border: 2px dashed #ccc; margin: 10px; border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; }
        .drop-zone:hover { border-color: var(--primary); background: #eef6ff; }
        
        .pool-container { flex: 1; overflow-y: auto; padding: 10px; }

        /* 可折叠文件夹样式 */
        details { margin-bottom: 8px; background: white; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
        summary { 
            padding: 10px; background: #f1f3f5; cursor: pointer; font-weight: bold; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center; list-style: none;
        }
        summary::-webkit-details-marker { display: none; } /* 隐藏默认箭头 */
        summary:after { content: '▶'; font-size: 10px; transition: transform 0.2s; }
        details[open] summary:after { transform: rotate(90deg); }
        summary:hover { background: #e9ecef; }

        .item-list { padding: 5px; border-top: 1px solid #eee; }
        .item-wrapper { 
            display: flex; align-items: center; gap: 5px; margin-bottom: 4px; 
            border: 1px solid transparent; padding-right: 8px; border-radius: 4px;
        }
        .item-wrapper:hover { border-color: #eee; background: #fafafa; }
        .item-link { 
            flex: 1; padding: 6px 8px; font-size: 13px; color: #444; text-decoration: none;
            cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-link:hover { color: var(--primary); }
        .item-link.active { color: var(--primary); font-weight: bold; }
        .btn-del { color: #ccc; cursor: pointer; font-size: 16px; padding: 2px 6px; }
        .btn-del:hover { color: var(--danger); }

        /* 右侧区域 */
        .content-area { flex: 1; background: #f0f2f5; position: relative; }
        #exercise-frame { width: 100%; height: 100%; border: none; background: white; }
        .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #999; }
        .btn-exam { background: #52c41a; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;">IELTS Studio - 智能折叠版</div>
    <button class="btn-exam" onclick="generateFullSet()">🎲 生成完整模考套题</button>
</header>

<div class="main-container">
    <div class="sidebar">
        <div class="drop-zone" onclick="document.getElementById('fInput').click()">
            批量拖入 HTML 练习文件
            <input type="file" id="fInput" multiple accept=".html,.htm" style="display:none">
        </div>
        
        <div class="pool-container">
            <!-- Part 1 -->
            <details id="details-p1">
                <summary>Part 1 <span class="badge" id="cnt-p1">0</span></summary>
                <div class="item-list" id="pool-p1"></div>
            </details>

            <!-- Part 2 -->
            <details id="details-p2">
                <summary>Part 2 <span class="badge" id="cnt-p2">0</span></summary>
                <div class="item-list" id="pool-p2"></div>
            </details>

            <!-- Part 3 -->
            <details id="details-p3">
                <summary>Part 3 <span class="badge" id="cnt-p3">0</span></summary>
                <div class="item-list" id="pool-p3"></div>
            </details>

            <!-- Part 4 -->
            <details id="details-p4">
                <summary>Part 4 <span class="badge" id="cnt-p4">0</span></summary>
                <div class="item-list" id="pool-p4"></div>
            </details>
        </div>
    </div>

    <div class="content-area">
        <div class="empty-state" id="emptyMsg">
            <h3>📂 文件夹已就绪</h3>
            <p>点击左侧文件夹展开题目</p>
        </div>
        <iframe id="exercise-frame" name="exercise-frame"></iframe>
    </div>
</div>

<script>
    let db = { p1:[], p2:[], p3:[], p4:[] };

    document.getElementById('fInput').onchange = (e) => handleFiles(e.target.files);
    window.ondragover = (e) => e.preventDefault();
    window.ondrop = (e) => { e.preventDefault(); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); };

    function handleFiles(files) {
        Array.from(files).forEach(file => {
            if (!file.name.match(/\.html?$/i)) return;
            const url = URL.createObjectURL(file);
            const name = file.name.replace(/\.html?$/i, '');
            const low = name.toLowerCase();
            
            let p = 'p1';
            if(low.includes('p2')) p = 'p2';
            else if(low.includes('p3')) p = 'p3';
            else if(low.includes('p4')) p = 'p4';
            
            db[p].push({ id: Date.now() + Math.random(), name, url });
            // 自动展开有新题目的文件夹
            document.getElementById(`details-${p}`).open = true;
        });
        renderPool();
    }

    function renderPool() {
        ['p1','p2','p3','p4'].forEach(p => {
            const container = document.getElementById(`pool-${p}`);
            document.getElementById(`cnt-${p}`).innerText = db[p].length;

            container.innerHTML = db[p].length ? db[p].map(item => `
                <div class="item-wrapper">
                    <a class="item-link" onclick="loadExam('${item.url}', this)" title="${item.name}">${item.name}</a>
                    <span class="btn-del" onclick="deleteItem('${p}', ${item.id})">×</span>
                </div>
            `).join('') : '<div style="padding:10px; color:#ccc; font-size:12px; text-align:center;">暂无题目</div>';
        });
    }

    function deleteItem(part, id) {
        event.stopPropagation(); // 防止触发文件夹关闭
        db[part] = db[part].filter(item => item.id !== id);
        renderPool();
    }

    function loadExam(url, el) {
        document.getElementById('emptyMsg').style.display = 'none';
        document.getElementById('exercise-frame').src = url;
        document.querySelectorAll('.item-link').forEach(l => l.classList.remove('active'));
        if(el) el.classList.add('active');
    }

    function generateFullSet() {
        let set = [];
        ['p1','p2','p3','p4'].forEach(p => {
            if(db[p].length > 0) {
                set.push(db[p][Math.floor(Math.random()*db[p].length)]);
                document.getElementById(`details-${p}`).open = true;
            }
        });
        if(set.length === 0) return alert("请先上传文件！");
        loadExam(set[0].url);
        alert(`已为你从已展开的文件夹中抽取 ${set.length} 部分题目。`);
    }
</script>
</body>
</html>
